name: Build and release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.APPBLOCKER_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/appblocker-signing.keystore"
          test -s "$RUNNER_TEMP/appblocker-signing.keystore"

      - name: Build signed APK
        env:
          APPBLOCKER_KEYSTORE_PATH: ${{ runner.temp }}/appblocker-signing.keystore
          APPBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.APPBLOCKER_KEYSTORE_PASSWORD }}
          APPBLOCKER_KEY_ALIAS: ${{ secrets.APPBLOCKER_KEY_ALIAS }}
          APPBLOCKER_KEY_PASSWORD: ${{ secrets.APPBLOCKER_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon clean assembleDebug
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          cp android/app/build/outputs/apk/debug/app-debug.apk "DeviceProtection-v${VERSION}.apk"
          echo "APK_NAME=DeviceProtection-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-APK
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
            --title "AppBlocker $GITHUB_REF_NAME" \
            --generate-notes
