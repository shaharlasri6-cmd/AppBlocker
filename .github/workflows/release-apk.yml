name: Build and release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.APPBLOCKER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/appblocker-signing.keystore"

      - name: Build signed APK
        shell: bash
        env:
          APPBLOCKER_KEYSTORE_PATH: ${{ runner.temp }}/appblocker-signing.keystore
          APPBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.APPBLOCKER_KEYSTORE_PASSWORD }}
          APPBLOCKER_KEY_ALIAS: ${{ secrets.APPBLOCKER_KEY_ALIAS }}
          APPBLOCKER_KEY_PASSWORD: ${{ secrets.APPBLOCKER_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon clean assembleDebug
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          APK_NAME="DeviceProtection-v${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppBlocker-APK
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
            --title "AppBlocker $GITHUB_REF_NAME" \
            --generate-notes
