<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AppBlocker Control</title>
  <link rel="stylesheet" href="/style.css?v=1.3.2">
</head>
<body>
  <div id="login" class="center">
    <div class="loginCard">
      <div class="brandMark">AB</div>
      <h1>AppBlocker</h1>
      <p class="muted">Private control center for your Android devices</p>
      <label for="password">Admin password</label>
      <div class="passwordRow">
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
        <button id="togglePassword" type="button" class="ghost">Show</button>
      </div>
      <button id="loginBtn" class="primary wide">Sign in</button>
      <div id="loginErr" class="error" role="alert"></div>
    </div>
  </div>

  <div id="app" class="hidden shell">
    <aside class="sidebar">
      <div class="brand"><div class="brandMark small">AB</div><div><b>AppBlocker</b><span>Control Center</span></div></div>
      <nav>
        <button class="nav active" data-view="overview">Overview</button>
        <button class="nav" data-view="apps">Applications</button>
        <button class="nav" data-view="protection">Protection</button>
        <button class="nav" data-view="settings">Settings</button>
        <button class="nav" data-view="pair">Pair device</button>
      </nav>
      <div class="sidebarBottom"><button id="refresh" class="ghost wide">Refresh data</button></div>
    </aside>

    <div class="workspace">
      <header>
        <div>
          <div class="eyebrow">Selected device</div>
          <select id="deviceSelect"></select>
        </div>
        <div id="headerStatus" class="statusPill">—</div>
      </header>
      <main id="content"></main>
    </div>
  </div>
  <script src="/app.js?v=1.3.2"></script>
</body>
</html>
